name: Gather AI headlines

# Collects recent stories from headline-feeds.json for the Learn tab's
# headlines (Mon/Wed/Fri), and saves them to the headline-candidates branch
# for the headlines task to pick from. Titles, links and feed summaries only.
on:
  schedule:
    - cron: "5 6 * * 1,3,5"   # 06:05 UTC, before the headlines task runs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet feedparser requests
      - run: python scripts/gather_headlines.py
      - name: Save to the headline-candidates branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd headline-candidates
          git init -q -b headline-candidates
          git add candidates.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Headline candidates $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" headline-candidates
