name: Update watch list

on:
  schedule:
    # Every 2 hours from 06:17 to 22:17 UTC: about 7am-11pm Irish summer
    # time (6am-10pm in winter). No overnight runs.
    - cron: "17 6-22/2 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest videos
        run: python scripts/fetch_feeds.py
      - name: Restore cached article text
        uses: actions/cache@v4
        with:
          path: .cache
          key: articles-${{ github.run_id }}
          restore-keys: articles-
      - name: Update channel catalogues
        # Needs the YOUTUBE_API_KEY secret; skipped quietly without it.
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          pip install --quiet requests
          python scripts/fetch_catalog.py
      - name: Fetch news
        # A news failure shouldn't stop the video page updating.
        continue-on-error: true
        env:
          NEWS_PASSWORD: ${{ secrets.NEWS_PASSWORD }}
        run: |
          pip install --quiet feedparser trafilatura cryptography requests
          python scripts/fetch_news.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
