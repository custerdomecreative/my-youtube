<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="build" content="__BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch List">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e9edf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a22" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script src="sync.js"></script>
<script src="toolbar.js"></script>
<style>
  .story { padding: 14px; }
  .story-top { display: flex; gap: 12px; align-items: flex-start; }
  .story-top .text { flex: 1; min-width: 0; }
  .story .title { font-size: 17px; line-height: 1.3; margin: 4px 0 6px; }
  .story .summary { color: var(--muted); font-size: 14px; margin: 0; }
  .thumb { flex: none; width: 92px; height: 92px; border-radius: 10px; object-fit: cover; background: var(--line); }
  .story-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .story-actions a.tick { text-decoration: none; display: inline-block; }
  .card.watched .summary { color: var(--done); }
  .card.watched .thumb { filter: grayscale(1) opacity(0.6); }
  .reader {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 17px; line-height: 1.6;
  }
  .reader p { margin: 0 0 1em; }
  .reader ul, .reader ol { margin: 0 0 1em; padding-left: 1.3em; }
  .reader li { margin: 0 0 0.4em; }
  .reader code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; background: var(--line); padding: 1px 5px; border-radius: 4px; }
  .reader figure { margin: 0 0 1em; }
  .reader img { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--line); }
  .reader figcaption { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 6px; }
  .reader h3 { font-size: 18px; line-height: 1.3; margin: 1.4em 0 0.5em; }
  .reader .done { margin-top: 4px; }
  .unlock { max-width: 360px; margin: 48px auto; text-align: center; }
  .unlock p { color: var(--muted); }
  .unlock form { display: flex; gap: 8px; margin-top: 16px; }
  .unlock input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .unlock button {
    font: inherit; padding: 10px 18px; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--bg); cursor: pointer;
  }
  .unlock .error { color: var(--accent); min-height: 1.4em; margin-top: 10px; font-size: 14px; }
  .lock { display: block; margin: 28px auto 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }

  .lesson-meta { color: var(--muted); font-size: 13px; }
  .lesson .title { font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.2; margin: 4px 0 2px; }
  .reader h4 { font-size: 16px; margin: 1.4em 0 0.5em; }
  .reader pre { background: var(--line); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.45; }
  .reader pre code { background: none; padding: 0; }
  .check details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; }
  .check summary { cursor: pointer; font-weight: 600; }
  .check details p { margin: 8px 0 0; }
  .sources { font-size: 14px; }
  .sources a { color: var(--ink); }
  .card.done .title { color: var(--done); }
  .tick.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .headline .why { font-size: 14px; margin: 8px 0 0; }
  .headline .why strong { color: var(--ink); }
  .digest-head { margin: 8px 0 -6px; }
  .digest-head h2 { font-size: 15px; margin: 0; }
  .digest-head p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .progress { color: var(--muted); font-size: 14px; margin: -6px 0 14px; }
  .upcoming { opacity: 0.6; }
  .read-link { font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="switch" aria-label="Sections"><a href="./">Videos</a><a href="channels.html">Channels</a><a href="news.html">News</a><a href="./?s=ai" aria-current="page">AI</a></nav>
  <header>
    <h1>AI</h1>
    <div class="updated" id="updated"></div>
  </header>
  <nav class="switch sub" id="ai-switch" aria-label="AI"><a href="./?s=ai">Videos</a><a href="news.html?s=ai">News</a><a href="learn.html" aria-current="page">Learn</a></nav>

  <section class="unlock" id="unlock" hidden>
    <p id="unlock-msg">Enter your news password. You'll only need to do this once on each device.</p>
    <form id="unlock-form">
      <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button type="submit">Unlock</button>
    </form>
    <div class="error" id="unlock-error"></div>
  </section>

  <div id="app" hidden>
    <div class="toolbar">
      <div class="tabs" role="group" aria-label="View">
        <button class="tab" data-view="today" aria-pressed="true">Today</button>
        <button class="tab" data-view="headlines" aria-pressed="false">Headlines<span class="count" id="count-headlines"></span></button>
        <button class="tab" data-view="lessons" aria-pressed="false">Lessons<span class="count" id="count-lessons"></span></button>
      </div>
    </div>
    <div class="warn" id="warn" hidden></div>
    <main class="list" id="list"></main>
    <button class="lock" id="lock">Lock this device</button>
  </div>
</div>

<script>
  // The Learn tab: a short lesson each weekday, and AI headlines on Mon/Wed/Fri.
  // Uses the same password (and saved key) as News. "Done" ticks sync between devices.
  const KEYS = { key: "news-key-v1", done: "learn-done-v1", view: "learn-view-v1" };
  const load = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

  let done = new Set(load(KEYS.done, []));
  let view = ["today", "headlines", "lessons"].includes(load(KEYS.view, "")) ? load(KEYS.view, "") : "today";
  let data = null, encrypted = null;
  const opened = new Set();   // lessons expanded in the Lessons list

  const $ = id => document.getElementById(id);
  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }
  function ago(iso) {
    if (!iso) return "";
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 60) return `${Math.max(mins, 1)} min ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs} hr${hrs === 1 ? "" : "s"} ago`;
    const days = Math.round(hrs / 24);
    return `${days} day${days === 1 ? "" : "s"} ago`;
  }
  const dayName = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-IE", { weekday: "long", day: "numeric", month: "short" });
  const todayIso = () => new Date().toLocaleDateString("en-CA");

  // **bold** and `code` inside lesson text, built without innerHTML.
  function inline(text) {
    const frag = document.createDocumentFragment();
    for (const part of String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/)) {
      if (!part) continue;
      if (part.startsWith("**") && part.endsWith("**")) frag.append(el("strong", { textContent: part.slice(2, -2) }));
      else if (part.startsWith("`") && part.endsWith("`")) frag.append(el("code", { textContent: part.slice(1, -1) }));
      else frag.append(part);
    }
    return frag;
  }
  function blocks(list) {
    return list.map(b => {
      if (b.h) return el("h3", {}, [inline(b.h)]);
      if (b.p) return el("p", {}, [inline(b.p)]);
      if (b.ul) return el("ul", {}, b.ul.map(i => el("li", {}, [inline(i)])));
      if (b.code) return el("pre", {}, [el("code", { textContent: b.code })]);
      return document.createTextNode("");
    });
  }
  const link = (url, text) => el("a", { href: url, textContent: text, target: "_blank", rel: "noopener" });

  function toggleDone(n) {
    const id = String(n);
    done.has(id) ? done.delete(id) : done.add(id);
    store(KEYS.done, [...done]);
    render();
    if (view === "today") window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function lessonCard(l, open) {
    const isDone = done.has(String(l.n));
    const card = el("article", { className: "card story lesson" + (isDone ? " done" : "") });
    const track = (data.tracks || {})[l.track] || "";
    card.append(el("div", { className: "lesson-meta", textContent: `Lesson ${l.n} of ${data.total} · ${track} · about ${l.minutes} min` }),
                el("h2", { className: "title", textContent: l.title }));
    const actions = el("div", { className: "story-actions" });
    if (!open) actions.append(el("button", { className: "tick", textContent: "Open", onclick: () => { opened.add(l.n); render(); } }));
    else if (view === "lessons") actions.append(el("button", { className: "tick", textContent: "Close", onclick: () => { opened.delete(l.n); render(); } }));
    actions.append(el("button", { className: "tick" + (isDone ? " on" : ""), textContent: isDone ? "Done ✓" : "Mark done", onclick: () => toggleDone(l.n) }));
    if (open) {
      const reader = el("div", { className: "reader" }, blocks(l.body));
      if (l.check?.length) {
        reader.append(el("h3", { textContent: "Check yourself" }),
          el("div", { className: "check" }, l.check.map(q => el("details", {}, [el("summary", {}, [inline(q.q)]), el("p", {}, [inline(q.a)])]))));
      }
      if (l.sources?.length) {
        reader.append(el("h4", { textContent: "Sources and further reading" }),
          el("ul", { className: "sources" }, l.sources.map(s => el("li", {}, [link(s.url, s.title)]))));
      }
      card.append(reader);
    }
    card.append(actions);
    return card;
  }

  function headlineCard(item) {
    const card = el("article", { className: "card story headline" });
    card.append(el("div", { className: "lesson-meta", textContent: item.source }),
                el("h2", { className: "title", textContent: item.title }),
                el("p", { className: "summary" }, [inline(item.summary)]));
    if (item.why) card.append(el("p", { className: "summary why" }, [el("strong", { textContent: "Why it matters: " }), inline(item.why)]));
    card.append(el("div", { className: "story-actions" }, [link(item.url, `Read on ${item.source}`)]));
    card.querySelector(".story-actions a").className = "tick read-link";
    return card;
  }

  function render() {
    if (!data) return;
    const lessons = data.lessons.filter(l => l.release <= todayIso());
    const digests = data.headlines || [];
    $("count-headlines").textContent = digests[0] ? digests[0].items.length : 0;
    $("count-lessons").textContent = `${lessons.filter(l => done.has(String(l.n))).length}/${lessons.length}`;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    const list = $("list");
    list.replaceChildren();

    if (view === "today") {
      const current = lessons.find(l => !done.has(String(l.n)));
      if (current) list.append(lessonCard(current, true));
      else {
        const next = (data.upcoming || [])[0];
        list.append(el("div", { className: "empty" }, [el("strong", { textContent: lessons.length ? "All caught up" : "Lessons start soon" }),
          next ? `Next: "${next.title}" on ${dayName(next.release)}.` : "No more lessons scheduled yet."]));
      }
    } else if (view === "headlines") {
      if (!digests.length) list.append(el("div", { className: "empty" }, [el("strong", { textContent: "No headlines yet" }), "They arrive on Monday, Wednesday and Friday mornings."]));
      for (const d of digests) {
        list.append(el("div", { className: "digest-head" }, [el("h2", { textContent: dayName(d.date) }), ...(d.intro ? [el("p", {}, [inline(d.intro)])] : [])]));
        for (const item of d.items) list.append(headlineCard(item));
      }
    } else {
      list.append(el("div", { className: "progress", textContent: `${lessons.filter(l => done.has(String(l.n))).length} of ${data.total} lessons done` }));
      for (const l of lessons.slice().reverse()) list.append(lessonCard(l, opened.has(l.n)));
      for (const u of data.upcoming || []) {
        list.append(el("article", { className: "card story lesson upcoming" }, [
          el("div", { className: "lesson-meta", textContent: `Lesson ${u.n} · ${dayName(u.release)}` }),
          el("h2", { className: "title", textContent: u.title })]));
      }
    }
  }

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    view = b.dataset.view; store(KEYS.view, view); render(); window.scrollTo({ top: 0 });
  }));

  // --- Decryption (same scheme and saved key as News) ---
  async function keyFromPassword(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(encrypted.salt), iterations: encrypted.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(encrypted.iv) }, key, b64(encrypted.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function savedKey() {
    const raw = load(KEYS.key, null);
    if (!raw) return null;
    try { return await crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, true, ["decrypt"]); }
    catch (e) { return null; }
  }
  function showUnlock(message, error = "") {
    $("app").hidden = true;
    $("unlock").hidden = false;
    if (message) $("unlock-msg").textContent = message;
    $("unlock-error").textContent = error;
  }
  function start(payload) {
    data = payload;
    $("unlock").hidden = true;
    $("app").hidden = false;
    $("updated").textContent = data.updated ? `Updated ${ago(data.updated)}` : "";
    render();
  }
  $("unlock-form").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("password").value;
    if (!pw || !encrypted) return;
    $("unlock-error").textContent = "Unlocking…";
    try {
      const key = await keyFromPassword(pw);
      const payload = await decrypt(key);
      store(KEYS.key, toB64(await crypto.subtle.exportKey("raw", key)));
      $("password").value = "";
      start(payload);
    } catch (err) {
      $("unlock-error").textContent = "That password didn't work.";
    }
  });
  $("lock").addEventListener("click", () => {
    try { localStorage.removeItem(KEYS.key); } catch (e) {}
    location.reload();
  });
  // A new day (or ticks from another device) can change what's shown.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { done = new Set(load(KEYS.done, [])); render(); } });
  window.addEventListener("storage", e => { if (e.key === KEYS.done) { done = new Set(load(KEYS.done, [])); render(); } });

  (async () => {
    try {
      const status = await fetch(`learn-status.json?t=${Date.now()}`, { cache: "no-store" }).then(r => r.json()).catch(() => null);
      if (status && status.configured === false) {
        showUnlock("Learn isn't set up yet: the NEWS_PASSWORD secret hasn't been added to the repository.");
        $("unlock-form").hidden = true;
        return;
      }
      if (status?.errors?.length) { $("warn").textContent = `Couldn't open: ${status.errors.join(", ")}`; $("warn").hidden = false; }
      encrypted = await fetch(`learn.enc.json?t=${Date.now()}`, { cache: "no-store" }).then(r => r.json());
      const key = await savedKey();
      if (key) {
        try { return start(await decrypt(key)); } catch (e) { /* password changed */ }
      }
      showUnlock();
    } catch (e) {
      showUnlock("Couldn't load Learn. Try again in a bit.");
      $("unlock-form").hidden = true;
    }
  })();
</script>
<script src="updater.js"></script>
</body>
</html>
