<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch List</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch List">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav class="switch" aria-label="Sections"><a href="./" aria-current="page">Videos</a><a href="news.html">News</a></nav>
  <header>
    <h1>Watch List</h1>
    <div class="updated" id="updated"></div>
  </header>
  <div class="toolbar">
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" data-view="new" aria-pressed="true">New<span class="count" id="count-new"></span></button>
      <button class="tab" data-view="later" aria-pressed="false">Later<span class="count" id="count-later"></span></button>
      <button class="tab" data-view="all" aria-pressed="false">All<span class="count" id="count-all"></span></button>
    </div>
    <select class="channel-filter" id="channel" aria-label="Filter by channel"></select>
  </div>
  <div class="bulk" id="bulk" hidden><button class="tick" id="mark-all"></button></div>
  <div class="warn" id="warn" hidden></div>
  <main class="list" id="list"></main>
</div>

<script>
  // Everything here is stored on this device only.
  if (/[?&]debug\b/.test(location.search)) document.body.classList.add("debug");
  const KEYS = { watched: "watched-v1", later: "later-v1", channel: "channel-v1" };
  const load = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  };
  const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

  let watched = new Set(load(KEYS.watched, []));
  // Saved videos keep their full details so they survive after
  // dropping out of the feed. Oldest-saved first, like a queue.
  let later = load(KEYS.later, []);
  let channel = load(KEYS.channel, "");
  let view = "new";
  let videos = [];

  const isLater = id => later.some(v => v.id === id);
  function saveState() {
    store(KEYS.watched, [...watched]);
    store(KEYS.later, later);
  }

  function ago(iso) {
    if (!iso) return "";
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 60) return `${Math.max(mins, 1)} min ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs} hr${hrs === 1 ? "" : "s"} ago`;
    const days = Math.round(hrs / 24);
    return `${days} day${days === 1 ? "" : "s"} ago`;
  }

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // Which videos belong in each tab, before the channel filter.
  function inView(name) {
    if (name === "new") return videos.filter(v => !watched.has(v.id) && !isLater(v.id));
    if (name === "later") return later;
    return videos;
  }
  const byChannel = list => channel ? list.filter(v => v.channel === channel) : list;
  const belongs = v => inView(view).some(x => x.id === v.id) && (!channel || v.channel === channel);

  function setFsIcon(btn, on) {
    btn.textContent = on ? "✕" : "⤢";
    btn.ariaLabel = on ? "Exit fullscreen" : "Fullscreen";
  }
  function toggleFullscreen(player, btn) {
    if (player.classList.contains("pseudo-fs")) {
      player.classList.remove("pseudo-fs"); document.body.classList.remove("no-scroll");
      return setFsIcon(btn, false);
    }
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
    const pseudo = () => {
      player.classList.add("pseudo-fs"); document.body.classList.add("no-scroll"); setFsIcon(btn, true);
    };
    const request = player.requestFullscreen || player.webkitRequestFullscreen;
    if (!request) return pseudo();  // iPhone: no fullscreen API for page elements
    try {
      const result = request.call(player);
      if (result && result.catch) result.catch(pseudo);
    } catch (e) { pseudo(); }
  }
  ["fullscreenchange", "webkitfullscreenchange"].forEach(evt => document.addEventListener(evt, () => {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    document.querySelectorAll(".player .fs").forEach(b => setFsIcon(b, b.parentElement === fsEl));
  }));
  document.addEventListener("keydown", e => {
    const open = document.querySelector(".player.pseudo-fs");
    if (e.key === "Escape" && open) toggleFullscreen(open, open.querySelector(".fs"));
  });

  function card(v) {
    const player = el("div", { className: "player" });
    const playBtn = el("button", { ariaLabel: `Play ${v.title}` }, [
      el("img", { src: v.thumbnail, alt: "", loading: "lazy" }),
      el("span", { className: "play" }),
    ]);
    playBtn.addEventListener("click", () => {
      // rel=0 limits end-screen suggestions to the same channel.
      // youtube.com (not youtube-nocookie.com) so a signed-in Premium
      // session can apply where the browser shares YouTube's cookies.
      // fs=0 hides YouTube's own fullscreen button; ours (below) makes the
      // whole player box fullscreen so the title-bar shield comes along.
      const src = `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&fs=0`;
      const fsBtn = el("button", { className: "fs", ariaLabel: "Fullscreen", textContent: "⤢" });
      fsBtn.addEventListener("click", () => toggleFullscreen(player, fsBtn));
      player.replaceChildren(el("iframe", {
        src, title: v.title,
        allow: "autoplay; encrypted-media; picture-in-picture",
      }), el("div", { className: "shield shield-title", ariaHidden: "true" }),
        el("div", { className: "shield shield-logo", ariaHidden: "true" }), fsBtn);
    });
    player.append(playBtn);

    const laterBtn = el("button", { className: "tick later" });
    const tick = el("button", { className: "tick" });
    const node = el("article", { className: "card" }, [
      player,
      el("div", { className: "meta" }, [
        el("div", { className: "text" }, [
          el("p", { className: "title", textContent: v.title }),
          el("div", { className: "sub", textContent: `${v.channel} · ${ago(v.published)}` }),
        ]),
        el("div", { className: "actions" }, [laterBtn, tick]),
      ]),
    ]);

    function paint() {
      const w = watched.has(v.id), l = isLater(v.id);
      node.classList.toggle("watched", w);
      tick.textContent = w ? "Watched ✓" : "Mark watched";
      laterBtn.classList.toggle("on", l);
      laterBtn.textContent = l ? "Saved ✓" : "Watch later";
    }
    function afterChange() {
      saveState();
      if (belongs(v)) { paint(); counts(); } else render();
    }

    laterBtn.addEventListener("click", () => {
      if (isLater(v.id)) later = later.filter(x => x.id !== v.id);
      else { later.push(v); watched.delete(v.id); }
      afterChange();
    });
    tick.addEventListener("click", () => {
      if (watched.has(v.id)) watched.delete(v.id);
      else { watched.add(v.id); later = later.filter(x => x.id !== v.id); }
      afterChange();
    });
    paint();
    return node;
  }

  function counts() {
    for (const name of ["new", "later", "all"]) {
      document.getElementById(`count-${name}`).textContent = byChannel(inView(name)).length;
    }
    updateBulk();
  }

  function buildChannelMenu() {
    const select = document.getElementById("channel");
    const names = [...new Set([...videos, ...later].map(v => v.channel))]
      .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    if (channel && !names.includes(channel)) channel = "";
    select.replaceChildren(
      el("option", { value: "", textContent: "All channels" }),
      ...names.map(n => el("option", { value: n, textContent: n })),
    );
    select.value = channel;
  }

  function render() {
    const list = document.getElementById("list");
    const shown = byChannel(inView(view));
    counts();
    if (!shown.length) {
      const msgs = {
        new: ["All caught up.", "That's everything. Go do something else."],
        later: ["Nothing saved.", "Tap “Watch later” on a video to keep it here."],
        all: ["Nothing here yet.", "Check back after the next update."],
      };
      const [title, text] = msgs[view];
      list.replaceChildren(el("div", { className: "empty" }, [
        el("strong", { textContent: title }), document.createTextNode(text),
      ]));
      return;
    }
    list.replaceChildren(...shown.map(card));
  }


  // "Mark all" on the New tab, for whatever the filter is showing.
  // Turns into Undo for a few seconds afterwards.
  let undo = null, undoTimer = null;
  function clearUndo() { undo = null; clearTimeout(undoTimer); }
  function updateBulk() {
    const bulk = document.getElementById("bulk"), btn = document.getElementById("mark-all");
    if (undo) { bulk.hidden = false; btn.textContent = `Undo — marked ${undo.length} as watched`; return; }
    const n = view === "new" ? byChannel(inView("new")).length : 0;
    bulk.hidden = !n;
    btn.textContent = n === 1 ? "Mark as watched" : `Mark all ${n} as watched`;
  }
  document.getElementById("mark-all").addEventListener("click", () => {
    if (undo) {
      undo.forEach(id => watched.delete(id));
      clearUndo();
    } else {
      undo = byChannel(inView("new")).map(x => x.id);
      undo.forEach(id => watched.add(id));
      undoTimer = setTimeout(() => { undo = null; updateBulk(); }, 8000);
    }
    saveState();
    render();
  });

  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
    view = btn.dataset.view;
    clearUndo();
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  }));
  document.getElementById("channel").addEventListener("change", e => {
    channel = e.target.value;
    clearUndo();
    store(KEYS.channel, channel);
    render();
  });

  fetch("videos.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      videos = data.videos || [];
      document.getElementById("updated").textContent = data.updated ? `Updated ${ago(data.updated)}` : "";
      if (data.errors && data.errors.length) {
        const warn = document.getElementById("warn");
        warn.textContent = `Couldn't refresh: ${data.errors.join(", ")}`;
        warn.hidden = false;
      }
      // Forget watched ticks for videos no longer in the feed or saved list.
      const ids = new Set([...videos, ...later].map(v => v.id));
      watched = new Set([...watched].filter(id => ids.has(id)));
      saveState();
      buildChannelMenu();
      render();
    })
    .catch(() => {
      document.getElementById("list").replaceChildren(el("div", { className: "empty" }, [
        el("strong", { textContent: "Couldn't load videos." }),
        document.createTextNode("Try again in a bit."),
      ]));
    });
</script>
</body>
</html>
