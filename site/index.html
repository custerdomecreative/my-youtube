<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch List</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch List">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #fffdf8;
    --ink: #1d1b16;
    --muted: #6d685c;
    --line: #e2ddd1;
    --accent: #c4502b;
    --accent-ink: #ffffff;
    --done: #8a857a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f;
      --surface: #201e17;
      --ink: #eeeadf;
      --muted: #9d978a;
      --line: #322f26;
      --accent: #e0714b;
      --accent-ink: #16150f;
      --done: #6f6a5f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; }
  .updated { color: var(--muted); font-size: 13px; text-align: right; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 20px; }
  .tab {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .count { opacity: 0.7; margin-left: 4px; }
  .list { display: grid; gap: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
  }
  .player { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .player button {
    all: unset; cursor: pointer; display: block; width: 100%; height: 100%; position: relative;
  }
  .player img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .player .play {
    position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.6); display: grid; place-items: center;
  }
  .player .play::after {
    content: ""; margin-left: 5px;
    border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent;
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* Invisible strip over the embedded player's title bar, so tapping the
     title or channel icon doesn't open YouTube. Controls stay usable. */
  .player .shield { position: absolute; top: 0; left: 0; right: 0; height: min(64px, 24%); z-index: 2; }
  .player .fs {
    position: absolute; top: 8px; right: 8px; z-index: 3; width: 38px; height: 38px;
    border: 0; border-radius: 10px; background: rgba(0, 0, 0, 0.6); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }
  /* Real fullscreen (desktop, iPad) and the fallback used on iPhone. */
  .player:fullscreen, .player.pseudo-fs { aspect-ratio: auto; width: 100%; height: 100%; background: #000; }
  .player.pseudo-fs {
    position: fixed; inset: 0; z-index: 1000; border-radius: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .player:fullscreen .shield, .player.pseudo-fs .shield { height: 80px; }
  .player.pseudo-fs .shield { top: env(safe-area-inset-top); }
  body.no-scroll { overflow: hidden; }
  .meta { padding: 12px 14px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 600; margin: 0 0 4px; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; }  .tick {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .card.watched .tick { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .card.watched .title, .card.watched .sub { color: var(--done); }
  .card.watched img { filter: grayscale(1) opacity(0.6); }
  .empty { text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; }
  .warn { color: var(--accent); font-size: 13px; margin: -8px 0 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 20px; }
  .toolbar .tabs { margin: 0; }
  .channel-filter {
    margin-left: auto; max-width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px;
  }
  .actions { flex: none; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .later.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Watch List</h1>
    <div class="updated" id="updated"></div>
  </header>
  <div class="toolbar">
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" data-view="new" aria-pressed="true">New<span class="count" id="count-new"></span></button>
      <button class="tab" data-view="later" aria-pressed="false">Later<span class="count" id="count-later"></span></button>
      <button class="tab" data-view="all" aria-pressed="false">All<span class="count" id="count-all"></span></button>
    </div>
    <select class="channel-filter" id="channel" aria-label="Filter by channel"></select>
  </div>
  <div class="warn" id="warn" hidden></div>
  <main class="list" id="list"></main>
</div>

<script>
  // Everything here is stored on this device only.
  const KEYS = { watched: "watched-v1", later: "later-v1", channel: "channel-v1" };
  const load = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  };
  const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

  let watched = new Set(load(KEYS.watched, []));
  // Saved videos keep their full details so they survive after
  // dropping out of the feed. Oldest-saved first, like a queue.
  let later = load(KEYS.later, []);
  let channel = load(KEYS.channel, "");
  let view = "new";
  let videos = [];

  const isLater = id => later.some(v => v.id === id);
  function saveState() {
    store(KEYS.watched, [...watched]);
    store(KEYS.later, later);
  }

  function ago(iso) {
    if (!iso) return "";
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 60) return `${Math.max(mins, 1)} min ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs} hr${hrs === 1 ? "" : "s"} ago`;
    const days = Math.round(hrs / 24);
    return `${days} day${days === 1 ? "" : "s"} ago`;
  }

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // Which videos belong in each tab, before the channel filter.
  function inView(name) {
    if (name === "new") return videos.filter(v => !watched.has(v.id) && !isLater(v.id));
    if (name === "later") return later;
    return videos;
  }
  const byChannel = list => channel ? list.filter(v => v.channel === channel) : list;
  const belongs = v => inView(view).some(x => x.id === v.id) && (!channel || v.channel === channel);

  function setFsIcon(btn, on) {
    btn.textContent = on ? "✕" : "⤢";
    btn.ariaLabel = on ? "Exit fullscreen" : "Fullscreen";
  }
  function toggleFullscreen(player, btn) {
    if (player.classList.contains("pseudo-fs")) {
      player.classList.remove("pseudo-fs"); document.body.classList.remove("no-scroll");
      return setFsIcon(btn, false);
    }
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
    const pseudo = () => {
      player.classList.add("pseudo-fs"); document.body.classList.add("no-scroll"); setFsIcon(btn, true);
    };
    const request = player.requestFullscreen || player.webkitRequestFullscreen;
    if (!request) return pseudo();  // iPhone: no fullscreen API for page elements
    try {
      const result = request.call(player);
      if (result && result.catch) result.catch(pseudo);
    } catch (e) { pseudo(); }
  }
  ["fullscreenchange", "webkitfullscreenchange"].forEach(evt => document.addEventListener(evt, () => {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    document.querySelectorAll(".player .fs").forEach(b => setFsIcon(b, b.parentElement === fsEl));
  }));
  document.addEventListener("keydown", e => {
    const open = document.querySelector(".player.pseudo-fs");
    if (e.key === "Escape" && open) toggleFullscreen(open, open.querySelector(".fs"));
  });

  function card(v) {
    const player = el("div", { className: "player" });
    const playBtn = el("button", { ariaLabel: `Play ${v.title}` }, [
      el("img", { src: v.thumbnail, alt: "", loading: "lazy" }),
      el("span", { className: "play" }),
    ]);
    playBtn.addEventListener("click", () => {
      // rel=0 limits end-screen suggestions to the same channel.
      // youtube.com (not youtube-nocookie.com) so a signed-in Premium
      // session can apply where the browser shares YouTube's cookies.
      // fs=0 hides YouTube's own fullscreen button; ours (below) makes the
      // whole player box fullscreen so the title-bar shield comes along.
      const src = `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&fs=0`;
      const fsBtn = el("button", { className: "fs", ariaLabel: "Fullscreen", textContent: "⤢" });
      fsBtn.addEventListener("click", () => toggleFullscreen(player, fsBtn));
      player.replaceChildren(el("iframe", {
        src, title: v.title,
        allow: "autoplay; encrypted-media; picture-in-picture",
      }), el("div", { className: "shield", ariaHidden: "true" }), fsBtn);
    });
    player.append(playBtn);

    const laterBtn = el("button", { className: "tick later" });
    const tick = el("button", { className: "tick" });
    const node = el("article", { className: "card" }, [
      player,
      el("div", { className: "meta" }, [
        el("div", { className: "text" }, [
          el("p", { className: "title", textContent: v.title }),
          el("div", { className: "sub", textContent: `${v.channel} · ${ago(v.published)}` }),
        ]),
        el("div", { className: "actions" }, [laterBtn, tick]),
      ]),
    ]);

    function paint() {
      const w = watched.has(v.id), l = isLater(v.id);
      node.classList.toggle("watched", w);
      tick.textContent = w ? "Watched ✓" : "Mark watched";
      laterBtn.classList.toggle("on", l);
      laterBtn.textContent = l ? "Saved ✓" : "Watch later";
    }
    function afterChange() {
      saveState();
      if (belongs(v)) { paint(); counts(); } else render();
    }

    laterBtn.addEventListener("click", () => {
      if (isLater(v.id)) later = later.filter(x => x.id !== v.id);
      else { later.push(v); watched.delete(v.id); }
      afterChange();
    });
    tick.addEventListener("click", () => {
      if (watched.has(v.id)) watched.delete(v.id);
      else { watched.add(v.id); later = later.filter(x => x.id !== v.id); }
      afterChange();
    });
    paint();
    return node;
  }

  function counts() {
    for (const name of ["new", "later", "all"]) {
      document.getElementById(`count-${name}`).textContent = byChannel(inView(name)).length;
    }
  }

  function buildChannelMenu() {
    const select = document.getElementById("channel");
    const names = [...new Set([...videos, ...later].map(v => v.channel))]
      .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    if (channel && !names.includes(channel)) channel = "";
    select.replaceChildren(
      el("option", { value: "", textContent: "All channels" }),
      ...names.map(n => el("option", { value: n, textContent: n })),
    );
    select.value = channel;
  }

  function render() {
    const list = document.getElementById("list");
    const shown = byChannel(inView(view));
    counts();
    if (!shown.length) {
      const msgs = {
        new: ["All caught up.", "That's everything. Go do something else."],
        later: ["Nothing saved.", "Tap “Watch later” on a video to keep it here."],
        all: ["Nothing here yet.", "Check back after the next update."],
      };
      const [title, text] = msgs[view];
      list.replaceChildren(el("div", { className: "empty" }, [
        el("strong", { textContent: title }), document.createTextNode(text),
      ]));
      return;
    }
    list.replaceChildren(...shown.map(card));
  }

  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
    view = btn.dataset.view;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  }));
  document.getElementById("channel").addEventListener("change", e => {
    channel = e.target.value;
    store(KEYS.channel, channel);
    render();
  });

  fetch("videos.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      videos = data.videos || [];
      document.getElementById("updated").textContent = data.updated ? `Updated ${ago(data.updated)}` : "";
      if (data.errors && data.errors.length) {
        const warn = document.getElementById("warn");
        warn.textContent = `Couldn't refresh: ${data.errors.join(", ")}`;
        warn.hidden = false;
      }
      // Forget watched ticks for videos no longer in the feed or saved list.
      const ids = new Set([...videos, ...later].map(v => v.id));
      watched = new Set([...watched].filter(id => ids.has(id)));
      saveState();
      buildChannelMenu();
      render();
    })
    .catch(() => {
      document.getElementById("list").replaceChildren(el("div", { className: "empty" }, [
        el("strong", { textContent: "Couldn't load videos." }),
        document.createTextNode("Try again in a bit."),
      ]));
    });
</script>
</body>
</html>
