<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="build" content="__BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News · The Margin</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Margin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<script>
  // The AI pages moved to the AI desk (ai.html); old news.html?s=ai links go there, keeping a story link.
  { const p = new URLSearchParams(location.search);
    if (p.get("s") === "ai") location.replace("ai.html" + (p.get("story") ? `?story=${encodeURIComponent(p.get("story"))}` : "")); }
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="news.css">
<script src="sync.js"></script>
<script src="toolbar.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>News</h1>
    <div class="updated" id="updated"></div>
  </header>
  <nav class="switch sub" id="mode" aria-label="News">
    <a href="news.html" data-mode="paper" aria-current="page">Today's paper</a><a href="news.html#all" data-mode="all">All stories</a>
  </nav>

  <section class="unlock" id="unlock" hidden>
    <p id="unlock-msg">Enter your news password. You'll only need to do this once on each device.</p>
    <form id="unlock-form">
      <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button type="submit">Unlock</button>
    </form>
    <div class="error" id="unlock-error"></div>
  </section>

  <div id="app" hidden>
    <p class="edition-head" id="edition-head"></p>
    <div id="all-tools" hidden>
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="View">
          <button class="tab" data-view="new" aria-pressed="true">New<span class="count" id="count-new"></span></button>
          <button class="tab" data-view="later" aria-pressed="false">Later<span class="count" id="count-later"></span></button>
          <button class="tab" data-view="all" aria-pressed="false">All<span class="count" id="count-all"></span></button>
        </div>
        <select class="channel-filter" id="source" aria-label="Filter by source"></select>
      </div>
      <div class="search-row"><input type="search" id="q" placeholder="Search all stories" aria-label="Search all stories" autocomplete="off"></div>
    </div>
    <div class="bulk" id="bulk" hidden><button class="tick" id="mark-all"></button></div>
    <div class="warn" id="warn" hidden></div>
    <main class="list" id="list"></main>
    <div class="uptodate" id="uptodate" hidden>
      <strong>You're up to date.</strong>That's today's edition.
      <div class="more"><a href="news.html#all" data-go="new">All stories →</a><a href="news.html#later" data-go="later" id="to-later" hidden></a></div>
    </div>
    <button class="lock" id="lock">Lock this device</button>
  </div>
</div>

<script src="news-core.js"></script>
<script src="paper.js"></script>
<script>
  // Everything here is stored on this device only. News opens on today's paper, a short finished list
  // (see paper.js). "All stories" is the whole feed, with New / Later / All and search.
  // The AI desk (ai.html) uses the same password and read ticks but keeps its own Read Later list.
  const { load, store, el, ago } = NewsCore;
  const KEYS = { read: "news-read-v1", later: "news-later-v1", source: "news-source-v1" };

  const st = {
    read: new Set(load(KEYS.read, [])),
    later: load(KEYS.later, []),    // full stories, oldest-saved first
    save() { store(KEYS.read, [...this.read]); store(KEYS.later, this.later); },
    changed(s, paint) { if (belongs(s)) { paint(); counts(); } else render(); },
  };
  let source = load(KEYS.source, "");
  let view = "paper";               // "paper" is today's edition; new / later / all are inside All stories
  let query = "";
  let stories = [];
  let encrypted = null;

  const $ = id => document.getElementById(id);
  const isLater = id => st.later.some(s => s.id === id);

  // --- What's in each view ---
  const laterIds = () => new Set(st.later.map(s => s.id));
  const paperList = () => Paper.todaysPaper(stories, st.read, laterIds());
  function inView(name) {
    if (name === "paper") return paperList();
    if (name === "new") return stories.filter(s => !st.read.has(s.id) && !isLater(s.id));
    if (name === "later") return st.later;
    return stories;
  }
  const bySource = list => source ? list.filter(s => s.source === source) : list;

  // Search covers the whole feed (title, summary, source and article text), whatever tab you're on.
  const haystacks = new WeakMap();
  function words(blocks) {
    return (blocks || []).map(b => typeof b === "string" ? b : b && b.h ? b.h
      : b && (b.p || b.li) ? (b.p || b.li).map(r => r[0]).join("") : "").join(" ");
  }
  const hay = s => { if (!haystacks.has(s)) haystacks.set(s, `${s.title} ${s.summary || ""} ${s.source} ${words(s.text)}`.toLowerCase()); return haystacks.get(s); };
  function searchPool() {
    const seen = new Set();
    return [...stories, ...st.later].filter(s => !seen.has(s.id) && seen.add(s.id));
  }
  const terms = () => query.toLowerCase().split(/\s+/).filter(Boolean);
  function current() {
    if (view === "paper") return paperList();
    const t = terms();
    if (t.length) return bySource(searchPool()).filter(s => t.every(w => hay(s).includes(w)));
    return bySource(inView(view));
  }
  const belongs = s => current().some(x => x.id === s.id);

  function setView(name) {
    view = name;
    clearUndo();
    const paper = name === "paper";
    $("all-tools").hidden = paper;
    document.querySelectorAll("#mode a").forEach(a => {
      if ((a.dataset.mode === "paper") === paper) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (!paper) document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
  }
  function counts() {
    for (const name of ["new", "later", "all"]) $(`count-${name}`).textContent = bySource(inView(name)).length;
    $("edition-head").hidden = view !== "paper";
    if (view === "paper") {
      const n = paperList().length;
      $("edition-head").textContent = n ? `Today's paper — ${n} ${n === 1 ? "story" : "stories"}` : "Today's paper — all read";
    }
    const saved = st.later.length;
    $("to-later").hidden = !saved;
    $("to-later").textContent = `Saved for later (${saved}) →`;
    updateBulk();
  }
  function buildSourceMenu() {
    const names = [...new Set([...stories, ...st.later].map(s => s.source))].sort();
    if (source && !names.includes(source)) source = "";
    $("source").replaceChildren(el("option", { value: "", textContent: "All sources" }),
      ...names.map(n => el("option", { value: n, textContent: n })));
    $("source").value = source;
  }
  function render() {
    const shown = current();
    counts();
    const paper = view === "paper";
    $("uptodate").hidden = !paper;
    if (!shown.length) {
      if (paper) return $("list").replaceChildren();   // the "You're up to date" note below is the message
      const none = terms().length ? ["No matches.", "Nothing in the feed matches that search."]
        : { new: ["All caught up.", "That's the news for now. Go do something else."],
            later: ["Nothing saved.", "Tap “Read later” on a story to keep it here."],
            all: ["Nothing here yet.", "Check back after the next update."] }[view];
      $("list").replaceChildren(el("div", { className: "empty" }, [el("strong", { textContent: none[0] }), document.createTextNode(none[1])]));
      return;
    }
    $("list").replaceChildren(...shown.map(s => NewsCore.storyCard(s, st)));
  }

  // "Mark all" on today's paper and the New tab, for whatever is showing. Turns into Undo for a few seconds.
  let undo = null, undoTimer = null;
  function clearUndo() { undo = null; clearTimeout(undoTimer); }
  function updateBulk() {
    const bulk = $("bulk"), btn = $("mark-all");
    if (undo) { bulk.hidden = false; btn.textContent = `Undo — marked ${undo.length} as read`; return; }
    const n = (view === "paper" || view === "new") && !terms().length ? current().length : 0;
    bulk.hidden = !n;
    btn.textContent = n === 1 ? "Mark as read" : `Mark all ${n} as read`;
  }
  $("mark-all").addEventListener("click", () => {
    if (undo) {
      undo.forEach(id => st.read.delete(id));
      clearUndo();
    } else {
      undo = current().map(x => x.id);
      undo.forEach(id => st.read.add(id));
      undoTimer = setTimeout(() => { undo = null; updateBulk(); }, 8000);
    }
    st.save();
    render();
  });

  // --- Controls ---
  function go(name, hash) {
    setView(name);
    history.replaceState(null, "", location.pathname + location.search + hash);
    render();
  }
  document.querySelectorAll("#mode a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    if (a.dataset.mode === "paper") go("paper", "");
    else go(view === "paper" ? "new" : view, "#all");
  }));
  document.querySelectorAll("#uptodate a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); go(a.dataset.go, "#all"); }));
  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => { setView(btn.dataset.view); render(); }));
  $("source").addEventListener("change", e => { clearUndo(); source = e.target.value; store(KEYS.source, source); render(); });
  $("q").addEventListener("input", e => { clearUndo(); query = e.target.value.trim(); render(); });
  $("lock").addEventListener("click", () => { NewsCore.forgetKey(); location.reload(); });

  function showUnlock(message) {
    $("app").hidden = true;
    $("unlock").hidden = false;
    if (message) $("unlock-msg").textContent = message;
  }
  NewsCore.wireUnlock({ form: $("unlock-form"), input: $("password"), errorEl: $("unlock-error"), getEnc: () => encrypted, onData: start });

  function start(data) {
    stories = data.stories || [];
    $("updated").textContent = data.updated ? `Updated ${ago(data.updated)}` : "";
    // Read ticks are synced between devices, so keep them (capped) rather than pruning.
    if (st.read.size > 5000) { st.read = new Set([...st.read].slice(-5000)); st.save(); }
    $("unlock").hidden = true;
    $("app").hidden = false;
    buildSourceMenu();
    // The front page and the edition's own links: #all is All stories, #later is the saved list in it.
    const hash = location.hash;
    setView(hash === "#later" ? "later" : hash === "#all" ? "new" : "paper");
    render();
    openWanted();
  }
  // The front page links to a story as news.html?story=<id>: open it here. The address keeps ?story=
  // until the story is open, because a sync or update can reload the page first and would lose it.
  function openWanted() {
    const id = new URLSearchParams(location.search).get("story");
    if (!id) return;
    const find = () => document.querySelector(`[data-id="${CSS.escape(id)}"]`);
    let node = find();
    if (!node) {   // not in today's paper, or hidden by a filter or search: look everywhere
      source = ""; store(KEYS.source, ""); query = ""; $("q").value = ""; buildSourceMenu();
      for (const name of ["paper", "new", "later", "all"]) {
        setView(name);
        render();
        node = find();
        if (node) break;
      }
    }
    const u = new URL(location.href);
    u.searchParams.delete("story");
    history.replaceState(null, "", u.pathname + u.search + (view === "paper" ? "" : "#all"));
    if (!node) return;
    node.scrollIntoView();
    const btn = node.querySelector(".story-actions > :first-child");
    if (btn && btn.tagName === "BUTTON") btn.click();
  }

  function refreshFromStorage() {
    if ($("app").hidden) return;   // still locked or loading
    st.read = new Set(load(KEYS.read, []));
    st.later = load(KEYS.later, []);
    if (document.querySelector(".reader")) return counts();   // don't close an open article
    buildSourceMenu();
    render();
  }
  let refreshTimer;
  const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refreshFromStorage, 150); };
  window.addEventListener("pageshow", e => { if (e.persisted) refreshSoon(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshSoon(); });
  window.addEventListener("storage", e => { if ([KEYS.read, KEYS.later].includes(e.key)) refreshSoon(); });

  (async () => {
    try {
      const status = await fetch(`status.json?t=${Date.now()}`, { cache: "no-store" }).then(r => r.json()).catch(() => null);
      if (status && status.configured === false) {
        showUnlock("News isn't set up yet: the NEWS_PASSWORD secret hasn't been added to the repository.");
        $("unlock-form").hidden = true;
        return;
      }
      const failed = (status?.sources || []).filter(s => s.error).map(s => s.name);
      if (failed.length) { $("warn").textContent = `Couldn't refresh: ${failed.join(", ")}`; $("warn").hidden = false; }
      encrypted = await fetch(`news.enc.json?t=${Date.now()}`, { cache: "no-store" }).then(r => r.json());
      const key = await NewsCore.savedKey();
      if (key) {
        try { return start(await NewsCore.decrypt(encrypted, key)); } catch (e) { /* password changed */ }
      }
      showUnlock();
    } catch (e) {
      showUnlock("Couldn't load the news. Try again in a bit.");
      $("unlock-form").hidden = true;
    }
  })();
</script>
<script src="updater.js"></script>
</body>
</html>
