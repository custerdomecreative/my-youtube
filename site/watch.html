<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="build" content="__BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch · The Margin</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Margin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<script>
  // The AI pages moved to the AI desk (ai.html); old watch.html?s=ai links go there, keeping a video link.
  { const p = new URLSearchParams(location.search);
    if (p.get("s") === "ai") location.replace("ai.html" + (p.get("v") ? `?v=${encodeURIComponent(p.get("v"))}` : "#videos")); }
</script>
<link rel="stylesheet" href="style.css">
<script src="sync.js"></script>
<script src="toolbar.js"></script>
<style>
  .channel-list { display: grid; gap: 10px; }
  .channel-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); text-decoration: none; font-weight: 600;
  }
  .channel-row span { color: var(--muted); font-weight: 400; font-size: 14px; white-space: nowrap; }
  .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 6px; }
  #p-channels h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 18px; }
  .controls input[type=search], .controls select {
    font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .controls input[type=search] { flex: 1 1 180px; min-width: 0; }
  .controls label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .more { display: block; margin: 20px auto 0; }
  .result-count { color: var(--muted); font-size: 13px; margin: -8px 0 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Watch</h1>
    <div class="updated" id="updated"></div>
  </header>
  <nav class="switch sub" id="watch-switch" aria-label="Watch"><a href="watch.html" data-tab="list" aria-current="page">Watch list</a><a href="watch.html#channels" data-tab="channels">Channels</a></nav>
  <section id="p-list">
  <div class="toolbar">
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" data-view="new" aria-pressed="true">New<span class="count" id="count-new"></span></button>
      <button class="tab" data-view="playing" aria-pressed="false">Playing<span class="count" id="count-playing"></span></button>
      <button class="tab" data-view="later" aria-pressed="false">Later<span class="count" id="count-later"></span></button>
      <button class="tab" data-view="favs" aria-pressed="false">★<span class="count" id="count-favs"></span></button>
      <button class="tab" data-view="all" aria-pressed="false">All<span class="count" id="count-all"></span></button>
    </div>
    <select class="channel-filter" id="channel" aria-label="Filter by channel"></select>
  </div>
  <div class="bulk" id="bulk" hidden><button class="tick" id="mark-all"></button></div>
  <div class="warn" id="warn" hidden></div>
  <main class="list" id="list"></main>
  </section>
  <section id="p-channels" hidden><main id="channels-main"></main></section>
</div>

<script src="player.js"></script>
<script src="search-config.js"></script>
<script src="search.js"></script>
<script src="channels.js"></script>
<script>
  // Everything here is stored on this device only. (The AI videos live on the AI desk, ai.html.)
  const KEYS = { watched: "watched-v1", later: "later-v1", channel: "channel-v1" };
  const load = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  };
  const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

  let watched = new Set(load(KEYS.watched, []));
  // Saved videos keep their full details so they survive after
  // dropping out of the feed. Oldest-saved first, like a queue.
  let later = load(KEYS.later, []);
  let channel = load(KEYS.channel, "");
  let view = "new";
  // The front page links here with #later (the watch list) and the like.
  const startView = location.hash.slice(1);
  if (["new", "playing", "later", "favs", "all"].includes(startView)) {
    view = startView;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  }
  let videos = [];

  const isLater = id => later.some(v => v.id === id);
  function saveState() {
    store(KEYS.watched, [...watched]);
    store(KEYS.later, later);
  }

  // Which videos belong in each tab, before the channel filter.
  function inView(name) {
    if (name === "new") return videos.filter(v => !watched.has(v.id) && !isLater(v.id));
    if (name === "later") return later;
    if (name === "playing") return getPlaying().filter(v => isWatch(v) && !watched.has(v.id));
    if (name === "favs") return getFavourites().filter(isWatch).reverse();   // newest first
    return videos;
  }
  const byChannel = list => channel ? list.filter(v => v.channel === channel) : list;
  const belongs = v => inView(view).some(x => x.id === v.id) && (!channel || v.channel === channel);

  function card(v) {
    const player = makePlayer(v);

    const laterBtn = el("button", { className: "tick later" });
    const tick = el("button", { className: "tick" });
    const node = el("article", { className: "card" }, [
      player,
      el("div", { className: "meta" }, [
        el("div", { className: "text" }, [
          el("p", { className: "title", textContent: v.title }),
          el("div", { className: "sub", textContent: `${v.channel} · ${ago(v.published)}` }),
        ]),
        el("div", { className: "actions" }, [laterBtn, tick, favButton(v, () => { if (!belongs(v)) render(); else counts(); }), musicLink(v)]),
      ]),
    ]);
    node.dataset.id = v.id;

    function paint() {
      const w = watched.has(v.id), l = isLater(v.id);
      node.classList.toggle("watched", w);
      tick.textContent = w ? "Watched ✓" : "Mark watched";
      laterBtn.classList.toggle("on", l);
      laterBtn.textContent = l ? "Saved ✓" : "Watch later";
    }
    function afterChange() {
      saveState();
      if (belongs(v)) { paint(); counts(); } else render();
    }

    laterBtn.addEventListener("click", () => {
      if (isLater(v.id)) later = later.filter(x => x.id !== v.id);
      else { later.push(v); watched.delete(v.id); }
      afterChange();
    });
    tick.addEventListener("click", () => {
      if (watched.has(v.id)) watched.delete(v.id);
      else { watched.add(v.id); later = later.filter(x => x.id !== v.id); clearProgress(v.id); }
      afterChange();
    });
    paint();
    return node;
  }

  function counts() {
    for (const name of ["new", "playing", "later", "favs", "all"]) {
      document.getElementById(`count-${name}`).textContent = byChannel(inView(name)).length;
    }
    updateBulk();
  }

  function buildChannelMenu() {
    const select = document.getElementById("channel");
    const names = [...new Set([...videos, ...later, ...getPlaying().filter(isWatch), ...getFavourites().filter(isWatch)].map(v => v.channel).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    if (channel && !names.includes(channel)) channel = "";
    select.replaceChildren(
      el("option", { value: "", textContent: "All channels" }),
      ...names.map(n => el("option", { value: n, textContent: n })),
    );
    select.value = channel;
  }

  function render() {
    const list = document.getElementById("list");
    const shown = byChannel(inView(view));
    counts();
    if (!shown.length) {
      const msgs = {
        new: ["All caught up.", "That's everything. Go do something else."],
        playing: ["Nothing in progress.", "Videos you've started but not finished show up here."],
        later: ["Nothing saved.", "Tap “Watch later” on a video to keep it here."],
        favs: ["No favourites yet.", "Tap “☆ Favourite” on any video to keep it here for good."],
        all: ["Nothing here yet.", "Check back after the next update."],
      };
      const [title, text] = msgs[view];
      list.replaceChildren(el("div", { className: "empty" }, [
        el("strong", { textContent: title }), document.createTextNode(text),
      ]));
      return;
    }
    list.replaceChildren(...shown.map(card));
  }


  // "Mark all" on the New tab, for whatever the filter is showing.
  // Turns into Undo for a few seconds afterwards.
  let undo = null, undoTimer = null;
  function clearUndo() { undo = null; clearTimeout(undoTimer); }
  function updateBulk() {
    const bulk = document.getElementById("bulk"), btn = document.getElementById("mark-all");
    if (undo) { bulk.hidden = false; btn.textContent = `Undo — marked ${undo.length} as watched`; return; }
    const n = view === "new" ? byChannel(inView("new")).length : 0;
    bulk.hidden = !n;
    btn.textContent = n === 1 ? "Mark as watched" : `Mark all ${n} as watched`;
  }
  document.getElementById("mark-all").addEventListener("click", () => {
    if (undo) {
      undo.forEach(id => watched.delete(id));
      clearUndo();
    } else {
      undo = byChannel(inView("new")).map(x => x.id);
      undo.forEach(id => watched.add(id));   // Playing hides watched videos, so Undo stays lossless
      undoTimer = setTimeout(() => { undo = null; updateBulk(); }, 8000);
    }
    saveState();
    render();
  });

  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
    view = btn.dataset.view;
    clearUndo();
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  }));
  document.getElementById("channel").addEventListener("change", e => {
    channel = e.target.value;
    clearUndo();
    store(KEYS.channel, channel);
    render();
  });

  // Coming back to this page (Back button, another tab, or the other device
  // syncing) can show a copy from memory: re-read what's saved and redraw.
  // If a video is playing, only update the counts so playback isn't interrupted.
  let loaded = false;   // set once the video list has arrived
  function refreshFromStorage() {
    if (!loaded) return;
    watched = new Set(load(KEYS.watched, []));
    later = load(KEYS.later, []);
    if (document.querySelector(".player iframe, .pseudo-fs")) return counts();
    buildChannelMenu();
    render();
  }
  let refreshTimer;
  const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refreshFromStorage, 150); };
  window.addEventListener("pageshow", e => { if (e.persisted) refreshSoon(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshSoon(); });
  window.addEventListener("storage", e => { if (["watched-v1", KEYS.later, "progress-v1", "favourites-v1"].includes(e.key)) refreshSoon(); });

  // The front page links to a video as watch.html?v=<id>: find it and start it. The address keeps ?v= until
  // the video is found, because a sync or update can reload the page first and would lose it.
  function openWanted() {
    const id = new URLSearchParams(location.search).get("v");
    if (!id) return;
    const find = () => document.querySelector(`[data-id="${CSS.escape(id)}"]`);
    let node = find();
    if (!node) {   // hidden by the channel filter or sitting in another tab: look everywhere
      channel = ""; store(KEYS.channel, ""); buildChannelMenu();
      for (const name of ["later", "new", "playing", "favs", "all"]) {
        view = name;
        document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
        render();
        node = find();
        if (node) break;
      }
    }
    const u = new URL(location.href);
    u.searchParams.delete("v");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
    if (!node) return;
    node.scrollIntoView({ block: "center" });
    const play = node.querySelector(".player > button");
    if (play) play.click();
  }

  // Watch list and Channels are two tabs of this page. #channels (or #channels/<id>) is the Channels tab;
  // the other tab's players are cleared when you switch, so nothing keeps playing out of sight.
  const onChannels = () => /^#channels(\/|$)/.test(location.hash);
  function showTab() {
    const ch = onChannels();
    document.getElementById("p-list").hidden = ch;
    document.getElementById("p-channels").hidden = !ch;
    document.querySelectorAll("#watch-switch a").forEach(a => {
      if ((a.dataset.tab === "channels") === ch) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (ch) {
      saveAll();
      if (loaded) render();
      Channels.route();
    } else {
      saveAll();
      document.getElementById("channels-main").replaceChildren();
      document.title = "Watch · The Margin";
    }
  }
  window.addEventListener("hashchange", showTab);
  document.querySelector('#watch-switch a[data-tab="list"]').addEventListener("click", e => {
    e.preventDefault();
    history.pushState(null, "", location.pathname + location.search);
    showTab();
  });
  showTab();

  fetch(`videos.json?t=${Date.now()}`, { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      videos = data.videos || [];
      document.getElementById("updated").textContent = data.updated ? `Updated ${ago(data.updated)}` : "";
      if (data.errors && data.errors.length) {
        const warn = document.getElementById("warn");
        warn.textContent = `Couldn't refresh: ${data.errors.join(", ")}`;
        warn.hidden = false;
      }
      // Watched ticks are shared with the Channels page, so keep them, capped.
      if (watched.size > 5000) { watched = new Set([...watched].slice(-5000)); saveState(); }
      buildChannelMenu();
      render();
      openWanted();
      loaded = true;
    })
    .catch(() => {
      document.getElementById("list").replaceChildren(el("div", { className: "empty" }, [
        el("strong", { textContent: "Couldn't load videos." }),
        document.createTextNode("Try again in a bit."),
      ]));
    });
</script>
<script src="updater.js"></script>
</body>
</html>
